type Query {
    all_bookings: [Booking]
    bookings_by_user(_userid: String!): Booking
}

type Mutation {
    add_booking(_userid: String!, _date: String!, _movieid: String!): Booking
    delete_booking(_userid: String!, _date: String!, _movieid: String!): Booking
}

type Booking {
    userid: String!
    dates: [BookingDate]
}

type BookingDate {
    date: String!
    movies: [Movie]
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
}
