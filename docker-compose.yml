services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "3200:3200"

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3201:3201"
    depends_on:
      - movie
      - schedule
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "3203:3203"

volumes:
  mongo-data:
